# Chart del ETL Agroeco-EU: descarga de Eurostat, limpieza y carga en
# PostgreSQL, como Job de carga inicial y CronJob mensual.
#
# Solo contiene el ETL. PostgreSQL (CloudNativePG), su backup, Garage, el
# namespace y los Secrets se gestionan aparte: un "helm uninstall" del ETL
# nunca debe poder borrar la base de datos ni sus credenciales.
apiVersion: v2
name: agroeco-etl
description: ETL de superficie de agricultura ecológica en la UE (Eurostat a PostgreSQL) como Job y CronJob
type: application

# Versión del chart: cambia cuando cambian las plantillas o los valores.
# 0.2.0: imagen fijable por digest e image.tag en la etiqueta de versión.
# 0.2.1: solo cambia appVersion.
# 0.3.0: PrometheusRule opcional (alertas.enabled) con AgroecoEtlJobFallido.
#        appVersion no cambia: el CI no construye imagen y prod sigue con la
#        misma imagen fijada por digest.
version: 0.3.0

# Versión del ETL: etiqueta de imagen por defecto (values.yaml → image.tag).
# GitHub Actions publica la imagen con esta etiqueta y falla si ya existe:
# cada cambio en etl/ obliga a subirla.
# 0.2.0: mensajes DEBUG y versión en el log. Publicada sin verificar y nunca
#        promovida (TS-09); la etiqueta no se reutiliza.
# 0.2.1: el mismo código, publicado con el flujo verificado del CI.
appVersion: "0.2.1"

# CronJob.spec.timeZone es estable desde 1.27; el chart se ha probado en 1.37.
# El "-0" permite versiones con sufijo, como v1.37.2+k3s1.
kubeVersion: ">=1.33.0-0"

keywords:
  - etl
  - eurostat
  - postgresql
  - cronjob
