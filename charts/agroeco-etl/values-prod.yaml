# Entorno prod (namespace agroeco, junto al clúster PostgreSQL agroeco-pg).
#
# Las claves que definen el entorno se repiten a propósito aunque coincidan
# con values.yaml: este archivo documenta prod por sí solo, y un cambio en los
# valores por defecto no puede alterar prod sin aparecer aquí.
#
# Uso:
#   helm install agroeco-etl charts/agroeco-etl -n agroeco \
#     -f charts/agroeco-etl/values-prod.yaml --timeout 10m

# Imagen de prod, fijada por etiqueta y digest: subir appVersion en Chart.yaml
# no cambia prod. El valor sale del bloque "Promoción a prod" del resumen de
# la ejecución del CI que probó esa imagen (commit fb222f7). Cambiarla es un
# commit de promoción que aplica ArgoCD; volver atrás, un git revert de ese commit.
image:
  repository: ghcr.io/samanaya11/agroeco-etl
  tag: "0.2.1"
  digest: "sha256:5c06ff2e7d0896f2fc0ae68c75213b87bf45ebf89efa4ac7f8d473973ec55338"

etl:
  nivelLog: INFO

postgres:
  enabled: true
  host: agroeco-pg-rw
  credentialsSecret: agroeco-db-app
  tls:
    sslmode: verify-full
    caSecret: agroeco-pg-ca

cronjob:
  schedule: "0 6 1 * *"
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

cargaInicial:
  ttlSecondsAfterFinished: 86400

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi
