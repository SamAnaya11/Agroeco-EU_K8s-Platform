# Parámetros del ETL que NO son secretos. Llegan al contenedor como
# variables de entorno (envFrom). Usuario y contraseña van en el Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agroeco-etl-config
  namespace: agroeco
  labels:
    app.kubernetes.io/name: agroeco-etl
    app.kubernetes.io/part-of: agroeco-eu
data:
  # Carpeta de raw/ y processed/ (volumen emptyDir montado en el pod)
  ETL_DIR_DATOS: "/datos"
  ETL_NIVEL_LOG: "INFO"

  # Fase 2: PostgreSQL ya existe en el clúster (CloudNativePG) -> carga completa.
  # (En la Fase 1 estaba en "false": solo extracción y limpieza.)
  ETL_CARGAR_BD: "true"

  # Conexión a PostgreSQL (variables estándar de libpq).
  # agroeco-pg-rw = Service que crea CloudNativePG y que apunta siempre a la
  # instancia primaria (también después de un failover).
  PGHOST: "agroeco-pg-rw"
  PGPORT: "5432"
  PGDATABASE: "agroeco"

  # Conexión cifrada obligatoria. Por defecto libpq usa "prefer" (cifra si puede
  # y, si no, se conecta sin cifrar sin avisar) y el pg_hba de CloudNativePG
  # también acepta conexiones sin TLS con contraseña: la obligación la pone el
  # cliente. "require" cifra pero no verifica la identidad del servidor;
  # "verify-full" (montando la CA agroeco-pg-ca) queda para el chart de la Fase 3.
  PGSSLMODE: "require"
