# Ejecución mensual del ETL (sustituye al timer trigger de Azure Functions).
# Cada vez que llega la hora, el CronJob crea un Job con la plantilla de abajo.
# (La plantilla repite la del Job manual; en la Fase 3 Helm la genera una sola vez.)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agroeco-etl-mensual
  namespace: agroeco
  labels:
    app.kubernetes.io/name: agroeco-etl
    app.kubernetes.io/part-of: agroeco-eu
spec:
  # Formato cron estándar (5 campos): minuto hora día mes día_semana.
  # Día 1 de cada mes a las 06:00 UTC, igual que el original ("0 0 6 1 * *" en NCRONTAB).
  schedule: "0 6 1 * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid        # nunca dos ejecuciones a la vez
  startingDeadlineSeconds: 3600    # si el clúster estaba apagado, arranca hasta 1 h tarde
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: agroeco-etl
        app.kubernetes.io/part-of: agroeco-eu
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: agroeco-etl
            app.kubernetes.io/part-of: agroeco-eu
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: etl
              image: agroeco-etl:0.1.0
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: agroeco-etl-config
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: agroeco-db-app
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: agroeco-db-app
                      key: password
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: datos
                  mountPath: /datos
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: datos
              emptyDir:
                sizeLimit: 500Mi
            - name: tmp
              emptyDir:
                sizeLimit: 100Mi
