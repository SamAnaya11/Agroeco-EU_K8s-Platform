# Garage: almacenamiento de objetos compatible con S3, destino de los backups
# de PostgreSQL (Barman Cloud Plugin). Sustituye a MinIO, archivado.
#
# Un solo nodo dentro del clúster (limitación aceptada de la demostración):
# sin réplicas de los objetos, así que el backup comparte el destino del
# clúster k3d. En un entorno real el bucket estaría fuera del clúster
# (Azure Blob Storage, otro centro de datos...).
#
# Requisito previo (no está en Git):
#   kubectl create secret generic garage-rpc -n garage \
#     --from-literal=rpc-secret="$(openssl rand -hex 32)"
#   Forma del Secret: k8s/ejemplos/garage-secret.example.yaml
#
# Configuración inicial tras el primer arranque (layout, bucket y clave):
# se hace con "kubectl exec -n garage garage-0 -- /garage ..." (ver README).
apiVersion: v1
kind: Namespace
metadata:
  name: garage
  labels:
    app.kubernetes.io/part-of: agroeco-eu
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: agroeco-eu
data:
  # Sin secretos: rpc_secret llega por la variable GARAGE_RPC_SECRET.
  # Sin sección [admin]: el CLI "garage" usa el canal RPC, no la API de
  # administración, así que no se abre ese puerto ni hace falta su token.
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    # SQLite para los metadatos: la opción recomendada en la guía oficial
    db_engine = "sqlite"

    # Un solo nodo: cada objeto se guarda una única vez
    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    # El cliente S3 (boto3 en el plugin) debe firmar con esta misma región
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    # Sin root_domain: acceso por ruta (http://host:3900/bucket/objeto),
    # sin necesidad de DNS comodín para los buckets
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: garage
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: agroeco-eu
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: garage
  ports:
    # Solo la API S3. El RPC (3901) no sale del pod: hay un único nodo.
    - name: s3
      port: 3900
      targetPort: s3
---
# StatefulSet y no Deployment: Garage guarda en su volumen la identidad del
# nodo (node ID) y el layout; el pod tiene que volver siempre a su disco.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: garage
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: agroeco-eu
spec:
  replicas: 1
  serviceName: garage
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
        app.kubernetes.io/part-of: agroeco-eu
      annotations:
        # Si cambia garage.toml, cambia este valor a mano para reiniciar el pod
        agroeco.eu/config-version: "1"
    spec:
      # Garage no habla con la API de Kubernetes: sin token montado
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garage
          # Versión fijada; en este repositorio las etiquetas no se sobrescriben
          image: dxflrs/garage:v2.5.0
          # Imagen mínima (scratch): solo el binario /garage, sin shell
          command: ["/garage", "server"]
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-rpc
                  key: rpc-secret
            - name: RUST_LOG
              value: "garage=info"
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml   # ruta por defecto del CLI y del servidor
              subPath: garage.toml
              readOnly: true
            - name: data
              mountPath: /var/lib/garage
          # Sin API de administración no hay /health: se comprueba el puerto S3
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # solo escribe en /var/lib/garage
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
