# EJEMPLO. NO APLICAR. Solo documenta la forma del Secret.
# (Está en k8s/ejemplos/ a propósito: "kubectl apply -f k8s/" no entra en
# subcarpetas, así que nunca sobrescribe el Secret real con este valor ficticio.)
#
# El Secret real se crea con kubectl y una contraseña aleatoria que no se
# guarda en ningún archivo:
#
#   kubectl -n agroeco create secret generic agroeco-db-app \
#     --type=kubernetes.io/basic-auth \
#     --from-literal=username=agroeco \
#     --from-literal=password="$(openssl rand -hex 24)"
#
# Tipo basic-auth con claves "username" y "password": es el formato que
# CloudNativePG acepta para crear el usuario de la aplicación (Fase 2). Así el
# mismo Secret sirve a la base de datos y al ETL (que lo lee como PGUSER y
# PGPASSWORD).
apiVersion: v1
kind: Secret
metadata:
  name: agroeco-db-app
  namespace: agroeco
type: kubernetes.io/basic-auth
stringData:
  username: agroeco
  password: CAMBIAR-valor-ficticio
